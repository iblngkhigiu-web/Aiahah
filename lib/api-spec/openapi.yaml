openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: llama
    description: Local Llama model operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /llama/chat:
    post:
      operationId: llamaChat
      tags: [llama]
      summary: Chat with the local Llama model
      description: Generates a response with the locally installed Llama model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlamaChatInput"
      responses:
        "200":
          description: Generated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlamaOutput"
        "400":
          description: Invalid request
        "503":
          description: Local Llama is unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LlamaChatInput:
      type: object
      properties:
        mode:
          type: string
          enum: [Focus, Create, Code]
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/LlamaMessageInput"
      required:
        - mode
        - messages
    LlamaMessageInput:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    LlamaOutput:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        local:
          type: boolean
      required:
        - content
        - model
        - local

